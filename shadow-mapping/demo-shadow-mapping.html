    <script>
        // Global state for the performance monitor
        let performanceState = {
            fps: 0.0
        };
        // Global state for the configuration parameters
        let configState = {
            background: { r: 0.4, g: 0.6, b: 0.9, a: 1.0 }
        };

        let directionalLightState = {
            color: { r: 1.0, g: 1.0, b: 1.0, a: 1.0 },
            direction: { x: 1.0, y: -1.0, z: -1.0 },
            enabled: true,
            intensity: 1.0
        };

        let shadowState = {
            lightPosition: { x: 1000.0, y: 1000.0, z: -1000.0 },
            lightLookAt: { x: 0.0, y: 0.0, z: 0.0 },
            padding: 100.0
        };

    </script>

    <script type="module">
        import { Pane } from '/DogEngine/lib/tweakpane-4.0.5.js';
        //import { mat4 } from 'gl-matrix';

        // --- Widget 1: Performance  ---
        const panePerformance = new Pane({ container: document.getElementById('ui-performance'), title: '📊 Performance' });
        panePerformance.addBinding(performanceState, 'fps', { label: 'FPS', readonly: true, view: 'number' }).on('change', emitUI);
        panePerformance.addBinding(performanceState, 'fps', {
            label: 'FPS Graph', readonly: true, view: 'graph',
            interval: 100, bufferSize: 64, min: 10, max: 200
        }).on('change', emitUI);

        // --- Widget 2: Config  ---
        const paneConfig = new Pane({ container: document.getElementById('ui-config'), title: '⚙️ Config' });
        paneConfig.addBinding(configState, 'background', { color: { type: 'float' } }).on('change', emitUI);

        // --- Widget 3: Lights  ---
        const paneLights = new Pane({ container: document.getElementById('ui-lights'), title: '💡 Lights & 🌒 Shadows' });
        const directionalLightFolder = paneLights.addFolder({
            title: 'Directional Light',
            expanded: false,   // optional
        });

        directionalLightFolder.addBinding(directionalLightState, 'color', { color: { type: 'float' } }).on('change', emitUI);
        directionalLightFolder.addBinding(directionalLightState, 'direction', { vector: { type: 'float' } }).on('change', emitUI);
        directionalLightFolder.addBinding(directionalLightState, 'enabled', { label: 'Enabled' }).on('change', emitUI);
        directionalLightFolder.addBinding(directionalLightState, 'intensity', { label: 'Intensity', min: 0, max: 100, step: 0.1 }).on('change', emitUI);

        const shadowFolder = paneLights.addFolder({
            title: 'Shadows',
            expanded: false,   // optional
        });

        shadowFolder.addBinding(shadowState, 'lightPosition', { label: "Light Position", vector: { type: 'float' } }).on('change', shadowChange);
        shadowFolder.addBinding(shadowState, 'lightLookAt', { label: "Loook At", vector: { type: 'float' } }).on('change', emitUI);
        shadowFolder.addBinding(shadowState, 'padding', { label: 'Padding', min: 0, max: 1000, step: 0.1 }).on('change', emitUI);

        // Send data to the engine
        function emitUI() {
            window.dispatchEvent(new CustomEvent(EVT_UI, { detail: performanceState }));
            window.dispatchEvent(new CustomEvent(EVT_UI, { detail: configState }));
            window.dispatchEvent(new CustomEvent(EVT_UI, { detail: directionalLightState }));
        }

        function shadowChange() {
            window.dispatchEvent(new CustomEvent(EVT_UI, { detail: shadowState }));
            createShadows();
        }

        // Refresh UI at a lower rate (e.g., 10Hz or 15Hz is enough for the human eye)
        setInterval(() => {
            panePerformance.refresh();
            paneLights.refresh();
        }, 100);

        window.addEventListener(EVT_INIT, (e) => {
            paneLights.refresh();
        });

        // Emit initial state
        emitUI();
        shadowChange();
    </script>

<body onload="init();">
    <canvas width="800" height="600" id="WebGPUcanvas"></canvas>

    <!-- Containers for Tweakpane -->
    <div id="ui-performance" class="widget-pane"></div>
    <div id="ui-config" class="widget-pane"></div>

    <!-- -->
    <div class="viewport-container">
        <div id="loading-overlay">
            <img src="/images/Pacman-loading.gif" alt="Loading...">
        </div>
    </div>

    <script type="text/javascript">
        var canvas;
        var pGraphics;

        let lastTime = 0;

        /******* Events' names for clean communication *******/
        const EVT_DATA = 'engine-data-update';
        const EVT_UI = 'ui-params-change';
        const EVT_INIT = 'engine-init';
        //***************************************************

        let wireframePipeline;
        let phongShadingPipeline;
        let shadowMapPipeline;

        let camera;

        let bindGroupLayouts;

        let depthTexture;
        let dummyTexture;
        let shadowMap;

        let propsBindGroup;
        let propsBindGroupLayout;
        let shadows;

        let dragon;
        let grid
        let cornellBox;
        let cube;

        let directionalLight;

        let screenShadowMap;

        let shadowPassDescriptor;
        let renderPassDescriptor;

        let meshesInShadow = [];

        //------------------- Demo's main functions -------------------
        async function createShapes() {
            const shape = new DogShape();

            let descriptor = {};
            descriptor.delta = [100.0, 0.0, 100.0];
            descriptor.numVertRows = 50;
            descriptor.numVertCols = 50;
            descriptor.position = [0.0, 0.0, 0.0];
            descriptor.texScale = 1.0;

            grid = shape.createGrid(descriptor);

            descriptor = {};
            descriptor.width = 200.0;
            descriptor.height = 200.0;
            descriptor.depth = 200.0;
            descriptor.boundingVolumeType = BoundingVolumeType.Box;
            cube = shape.createCube(descriptor);

            descriptor = {};
            descriptor.boundingVolumeType = BoundingVolumeType.Box;

            cornellBox = shape.createCornellBox(descriptor);

            dragon = await webGPUengine.createMeshByObjFile("/resources/models/dragon_standford.obj");
            dragon.getTransform().translateAbsolute(0.0, 260.0, 0.0);
            dragon.getTransform().scaleAbsolute(250.0, 250.0, 250.0);
            dragon.getTransform().rotateAbsolute(0.0, 90.0, 0.0);

            cube.getTransform().translateAbsolute(0.0, 100.0, 0.0);

            meshesInShadow.push(cube);
            meshesInShadow.push(cornellBox);
        }

        /**
         * Configures the Cornell Box. Adding and asigning the materials to each plane.
         */
        function configCornellBox() {
            let m_red = new DogMaterial("m_red", true, false);
            m_red.setDiffuseColor([1.0, 0.0, 0.0, 1.0]);
            m_red.setAmbientColor([0.1, 0.0, 0.0, 1.0]);

            let m_white = new DogMaterial("m_white", true, false);
            m_white.setDiffuseColor([1.0, 1.0, 1.0, 1.0]);
            m_white.setAmbientColor([0.1, 0.1, 0.1, 1.0]);

            let m_green = new DogMaterial("m_green", true, false);
            m_green.setDiffuseColor([0.0, 1.0, 0.0, 1.0]);
            m_green.setAmbientColor([0.0, 0.1, 0.0, 1.0]);
            m_green.setSpecularColor([0.0, 0.0, 0.0, 1.0]);
            m_green.setSpecularPower(0.0);

            resourceManager.add("m_red", m_red);
            resourceManager.add("m_white", m_white);
            resourceManager.add("m_green", m_green);

            let texture = webGPUengine.createDummyTexture();
            let sampler = new DogSampler("", { magFilter: 'linear', minFilter: 'linear' });

            cornellBox.setMaterial(3, m_red.getId());
            cornellBox.setMaterial(4, m_green.getId());
            cornellBox.setMaterial(0, m_white.getId());
            cornellBox.setMaterial(1, m_white.getId());
            cornellBox.setMaterial(2, m_white.getId());
            cornellBox.setMaterial(5, m_white.getId());

            let idBindGroup = createBGMateralTexSamp(m_red, texture, sampler);
            idBindGroup = createBGMateralTexSamp(m_white, texture, sampler);
            idBindGroup = createBGMateralTexSamp(m_green, texture, sampler);
        }

        function createLightsAndMaterials() {
            directionalLight = new DogDirectionalLight(true, false);

            const material = new DogMaterial("m_yellow", true, false);
            material.setDiffuseColor([1.0, 1.0, 0.0, 1.0]);
            material.setAmbientColor([0.1, 0.1, 0.0, 1.0]);
            material.setSpecularColor([0.7, 0.7, 0.7, 1.0]);

            resourceManager.add("m_yellow", material);

            cube.setMaterial(0, material.getId());

            dummyTexture = webGPUengine.createDummyTexture();
            const sampler = webGPUengine.createDogSampler("", { magFilter: "linear", minFilter: "linear" });

            const idBindGroup = createBGMateralTexSamp(material, dummyTexture, sampler);
            material.setIdBindGroup(idBindGroup);
        }

        async function createPipeline() {
            let bgl = [
                resourceManager.getBindGroupLayout(0),
                undefined, // Bind group 1 is not used in this demo
                propsBindGroupLayout,
                resourceManager.getBindGroupLayout(3)
            ];

            wireframePipeline = new WireframePipeline(bgl);

            bgl = [
                resourceManager.getBindGroupLayout(0),
                resourceManager.getBindGroupLayout(1),
                resourceManager.getBindGroupLayout(2),
                resourceManager.getBindGroupLayout(3)
            ];

            let phongShadingShaders = [
                await webGPUengine.readFileAsText("/shaders/Common.wgsl"),
                await webGPUengine.readFileAsText("/shaders/LightsAndMaterial.wgsl"),
                await webGPUengine.readFileAsText("/shadow-mapping/shaders/PhongShader.wgsl")
            ];

            phongShadingPipeline = new GeneralPipeline("Phong-Shading-", bgl, phongShadingShaders);

            let shadowMapShaders = [
                await webGPUengine.readFileAsText("/shadow-mapping/shaders/ShadowMapShader.wgsl")
            ];

            shadows.bglShadowMap = [
                resourceManager.getBindGroupLayout(0),
                undefined,
                undefined,
                resourceManager.getBindGroupLayout(3)
            ];

            const idBufferShadow = webGPUengine.createDogBuffer("shadow-buffer", BufferType.Data, null, 16 * 4 * 2, true);
            shadows.buffer = resourceManager.get(idBufferShadow);

            const jsonShadowMap = {
                label: "Shadow Map Bind Group",
                layout: resourceManager.getBindGroupLayout(0),
                entries: [
                    {
                        binding: 0,
                        resource: { buffer: shadows.buffer.getWebGPUBuffer() }
                    }
                ]
            };

            let idBindGroupShadowMap = webGPUengine.createBindGroup(resourceManager.getCounter(), jsonShadowMap);

            shadows.bgShadowMap = resourceManager.getBindGroup(idBindGroupShadowMap);

            shadowMapPipeline = new ShadowMapPipeline("ShadowMap-", shadows.bglShadowMap, shadowMapShaders);

            //shadows.bgl = createBGLForShadows();

            shadows.bindGroup = createBGForShadows(directionalLight.getBuffer(), shadows.buffer, shadowMap, resourceManager.get(shadowMap.getIdSampler()));

            directionalLight.setIdBindGroup(shadows.bindGroup);
        }

        function createProps() {
            propsBindGroupLayout = pGraphics.device.createBindGroupLayout({
                entries: [{
                    binding: 0,                           // Same index as in the bindGroup
                    visibility: GPUShaderStage.FRAGMENT,    // In which stages is visible
                    buffer: {
                        type: "uniform"                     // uniform buffer (default)
                    }
                }]
            });

            var propsData = new Float32Array([1.0, 1.0, 0.0, 1.0]); // Color amarillo
            var propsBuffer = pGraphics.device.createBuffer({
                size: propsData.byteLength,
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            });

            pGraphics.device.queue.writeBuffer(propsBuffer, 0, propsData.buffer);

            propsBindGroup = pGraphics.device.createBindGroup({
                layout: propsBindGroupLayout,
                entries: [
                    {
                        binding: 0,
                        resource: {
                            buffer: propsBuffer,
                        },
                    },
                ],
            });
        }

        /**
         * Create render targets for the shadow map and the depth texture.
         */
        function createRenderTargets() {
            depthTexture = webGPUengine.createDogTexture("depthTexture", {
                size: [canvas.width, canvas.height],
                format: 'depth24plus',
                usage: GPUTextureUsage.RENDER_ATTACHMENT,
            });

            shadowMap = webGPUengine.createDogTexture("shadowMap", {
                size: [1024, 1024, 1],
                usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
                format: 'depth32float'
            });

            const shadowSampler = webGPUengine.createDogSampler("shadowSampler", {
                compare: 'less'
            });

            shadowMap.setIdSampler(shadowSampler.getId());

            // GPURenderPassDescriptor
            shadowPassDescriptor = {
                colorAttachments: [],
                depthStencilAttachment: {
                    view: shadowMap.getWebGPUTextureView(),
                    depthClearValue: 1.0,
                    depthLoadOp: 'clear',
                    depthStoreOp: 'store',
                },
            };

            // GPURenderPassDescriptor
            renderPassDescriptor = {
                colorAttachments: [
                    {
                        // view is acquired and set in render loop.
                        view: undefined,

                        clearValue: { r: configState.background.r, g: configState.background.g, b: configState.background.b, a: configState.background.a },
                        loadOp: 'clear',
                        storeOp: 'store',
                    },
                ],
                depthStencilAttachment: {
                    view: depthTexture.getWebGPUTextureView(),

                    depthClearValue: 1.0,
                    depthLoadOp: 'clear',
                    depthStoreOp: 'store',
                    /*stencilClearValue: 0,
                    stencilLoadOp: 'clear',
                    stencilStoreOp: 'store',*/
                },
            };
        }

        function createShadows() {
            if (shadowState === undefined || shadowState == null)
                return;

            shadows.lightPosition = [shadowState.lightPosition.x, shadowState.lightPosition.y, shadowState.lightPosition.z];
            shadows.lightLookAt = [shadowState.lightLookAt.x, shadowState.lightLookAt.y, shadowState.lightLookAt.z];

            if (directionalLight !== undefined && directionalLight != null) {
                directionalLight.setPosition([shadowState.lightPosition.x, shadowState.lightPosition.y, shadowState.lightPosition.z, 1.0]);

                let dirLight = glMatrix.vec3.create();
                glMatrix.vec3.subtract(dirLight, shadows.lightLookAt, shadows.lightPosition);
                glMatrix.vec3.normalize(dirLight, dirLight);

                directionalLight.setDirection([dirLight[0], dirLight[1], dirLight[2], 0.0]);
                directionalLightState.direction.x = dirLight[0];
                directionalLightState.direction.y = dirLight[1];
                directionalLightState.direction.z = dirLight[2];
            }

            let sceneBounds = webGPUengine.getAllMinAndMaxVectorInMeshes(meshesInShadow);

            let light = webGPUengine.calculateDynamicLightMatrices(shadows.lightPosition, shadows.lightLookAt, sceneBounds, shadowState.padding);

            shadows.lightViewMatrix = light.viewMatrix;
            shadows.lightProjectionMatrix = light.projectionMatrix;

            console.log("shadows");
        }

        //------------------ End demo's main functons -----------------

        /**
         * Initializes WebGPU, sets up event listeners for input, and starts the render loop.
         */
        async function init() {
            canvas = document.getElementById("WebGPUcanvas");

            pGraphics = await webGPUengine.initWebGPU(canvas);

            window.onkeydown = event => this.onKeyDown(event);
            window.onkeyup = event => this.onKeyUp(event);
            canvas.onmouseup = event => this.onMouseUp(event);
            canvas.onmousedown = event => this.onMouseDown(event);
            canvas.onmousemove = event => this.onMouseMove(event);

            let configScene = await webGPUengine.readFileAsJson("/shadow-mapping/config/camera-dl-material-mesh.json");

            webGPUengine.createBindGroupLayouts(configScene);

            camera = new DogCamera();
            camera.setPosition([0.0, 100.0, 600.0]);
            camera.setSpeed(5.3);
            camera.setFarPlane(4000.0);

            shadows = {};

            await createShapes();
            createLightsAndMaterials();
            createRenderTargets();
            createProps();
            await createPipeline();
            configCornellBox();
            createShadows();

            dummyTexture = webGPUengine.createDummyTexture();
            const sampler = webGPUengine.createDogSampler("", { magFilter: "linear", minFilter: "linear" });

            dummyTexture.setIdSampler(sampler.getName());

            screenShadowMap = new DogScreen("ScreenShadowMap", 200, 100, "depth");
            screenShadowMap.setPosition([10.0, 100.0, 0.0]);

            screenShadowMap.setTexture(shadowMap);
            screenShadowMap.setVisible(false);

            const overlay = document.getElementById('loading-overlay');

            overlay.classList.add('hidden');

            requestAnimationFrame(updateAndRender);
        }

        //------------- Input -------------
        /**
         * Release click and stop dragging.
         * @param {MouseEvent} event 
         */
        function onMouseUp(event) {
            this.dragging = false;
            mouse.down = false;
        }

        /**
         * Click and start dragging.
         * @param {MouseEvent} event 
         */
        function onMouseDown(event) {
            this.dragging = true;
            var x = event.clientX; // x coordinate of a mouse pointer
            var y = event.clientY; // y coordinate of a mouse pointer
            var rect = event.target.getBoundingClientRect();

            //console.log("Mouse down at: " + x + ", " + y);
            mouse.down = true;
            mouse.x = x;
            mouse.y = y;

            //x = ((x - rect.left) - canvas.width / 2) / (canvas.width / 2);
            //y = (canvas.height / 2 - (y - rect.top)) / (canvas.height / 2);
            console.log("Mouse down at: " + x + ", " + y);
        }

        /**
         * If dragging, calculates the difference in mouse position and rotates the camera.
         * @param {MouseEvent} event 
         */
        function onMouseMove(event) {
            this.lastX = this.x;
            this.lastY = this.y;

            this.x = event.clientX;
            this.y = event.clientY;

            mouse.x = this.x;
            mouse.y = this.y;

            if (!this.dragging)
                return;

            const dx = this.x - this.lastX;
            const dy = this.y - this.lastY;

            camera.yaw(dx * camera.getSpeedRotation());
            camera.pitch(dy * camera.getSpeedRotation());
        }

        /**
         * Handles input events.
         */
        function input() {
            if (keypress[KeyCode.W])
                camera.moveForward(1);
            if (keypress[KeyCode.S])
                camera.moveForward(-1);
            if (keypress[KeyCode.A])
                camera.strafe(-1);
            if (keypress[KeyCode.D])
                camera.strafe(1);
            if (keypress[KeyCode.Left])
                camera.yaw(0.01);
            if (keypress[KeyCode.Right])
                camera.yaw(-0.01);
            if (keypress[KeyCode.Up])
                camera.pitch(0.01);
            if (keypress[KeyCode.Down])
                camera.pitch(-0.01);
        }

        //------------- End Input -------------
        /**
         * Updates the performance state and handles input.
         * @param {float} time - The current time in milliseconds.
         */
        function update(time) {
            const dt = (time - lastTime);
            lastTime = time;

            performanceState.fps = 1000 / dt;

            input();

            //--------------- update lights and materials from the UI state ---------------
            directionalLight.setDirection([directionalLightState.direction.x, directionalLightState.direction.y, directionalLightState.direction.z, 0.0]);
            directionalLight.setColor([directionalLightState.color.r, directionalLightState.color.g, directionalLightState.color.b, directionalLightState.color.a]);
            directionalLight.setEnabled(directionalLightState.enabled);
            directionalLight.setIntensity(directionalLightState.intensity);
            //--------------- end update lights and materials from the UI state ---------------

            dragon.update(dt);
            cornellBox.update(dt);

            cube.update(dt);

            grid.update(dt);

            screenShadowMap.update();
        }

        /**
         * Renders a frame by encoding commands to clear the screen and submit them to the GPU.
         */
        function render() {
            renderPassDescriptor.colorAttachments[0].view = pGraphics.context.getCurrentTexture().createView();

            const commandEncoder = pGraphics.device.createCommandEncoder();
            {
                pGraphics.device.queue.writeBuffer(shadows.buffer.getWebGPUBuffer(), 0, shadows.lightViewMatrix);
                pGraphics.device.queue.writeBuffer(shadows.buffer.getWebGPUBuffer(), 16 * 4, shadows.lightProjectionMatrix);

                const shadowPass = commandEncoder.beginRenderPass(shadowPassDescriptor);
                shadowPass.setPipeline(shadowMapPipeline.getWebGPUPipeline());
                shadowPass.setBindGroup(0, shadows.bgShadowMap);

                cube.render(shadowPass);
                dragon.render(shadowPass);

                shadowPass.end();
            }
            {
                pGraphics.device.queue.writeBuffer(camera.getBuffer().getWebGPUBuffer(), 0, camera.getViewMatrix());
                pGraphics.device.queue.writeBuffer(camera.getBuffer().getWebGPUBuffer(), 16 * 4, camera.getProjectionMatrix());
                pGraphics.device.queue.writeBuffer(directionalLight.getBuffer().getWebGPUBuffer(), 0, directionalLight.getData());

                const renderPass = commandEncoder.beginRenderPass(renderPassDescriptor);

                renderPass.setBindGroup(camera.getGroup(), camera.getBindGroup());

                renderPass.setPipeline(wireframePipeline.getWebGPUPipeline());
                renderPass.setBindGroup(2, propsBindGroup); // Bind group para Props
                grid.render(renderPass);

                renderPass.setPipeline(phongShadingPipeline.getWebGPUPipeline());
                //renderPass.setBindGroup(directionalLight.getGroup(), directionalLight.getBindGroup());
                renderPass.setBindGroup(1, resourceManager.getBindGroup(shadows.bindGroup));

                dragon.render(renderPass);
                cornellBox.render(renderPass);
                cube.render(renderPass);

                screenShadowMap.render(renderPass);

                renderPass.end();
            }

            const commandBuffer = commandEncoder.finish();

            // Finish the command buffer and immediately submit it.
            pGraphics.device.queue.submit([commandBuffer]);
            //console.log("Frame rendered");
        }

        /**
         * Combines the update and render functions into a single loop that runs on each animation frame.
         * @param {float} currentTime - The current time in milliseconds.
         */
        function updateAndRender(currentTime) {
            update(currentTime);
            render();

            requestAnimationFrame(updateAndRender);
        }
    </script>
